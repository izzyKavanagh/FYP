name: Firewall CI
 
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
 
jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
 
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt install -y \
            build-essential \
            python3-dev
 
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
 
      - name: Run unit tests
        run: |
          pytest Firewall/Tests/flow_manager_tests.py \
                 Firewall/Tests/feature_extractor_tests.py \
                 Firewall/Tests/firewall_tests.py \
                 -v --tb=short